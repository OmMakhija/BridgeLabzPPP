<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Selection Page</title>
</head>
<body>

  <header>
    <h1>Travel Preferences Selection</h1>
  </header>

  <main>
    <form>
      <label for="country">Country:</label><br>
      <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
        <option value="greece">Greece</option>
      </select>
      <br><br>

      <label for="state">State:</label><br>
      <select id="state" name="state">
        <option value="uttarpradesh" selected>Uttar Pradesh</option>
        <option value="maharashtra">Maharashtra</option>
        <option value="karnataka">Karnataka</option>
        <option value="rajasthan">Rajasthan</option>
      </select>
      <br><br>

      <label for="city">City:</label><br>
      <select id="city" name="city">
        <option value="mathura" selected>Mathura</option>
        <option value="agra">Agra</option>
        <option value="jaipur">Jaipur</option>
        <option value="bangalore">Bangalore</option>
      </select>
      <br><br>

      <label for="place">Favorite Tourist Place:</label><br>
      <select id="place" name="place">
        <option value="tajmahal">Taj Mahal</option>
        <option value="krishna_temple" selected>Krishna Temple</option>
        <option value="fatehpur_sikri">Fatehpur Sikri</option>
        <option value="agra_fort">Agra Fort</option>
      </select>
      <br><br>

    </form>

    <p>
      You have selected <strong>India</strong> as your country, specifically <strong>Uttar Pradesh</strong>,
      in the city of <strong>Mathura</strong>, and your favorite tourist place is <strong>Krishna Temple</strong>.
    </p>
  </main>

  <footer>
    <p>© 2025 Travel Explorer. All Rights Reserved.</p>
  </footer>

</body>
</html>
